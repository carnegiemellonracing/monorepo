name: Software Tests
run-name: ${{ github.actor }}-${{ github.repository }} Software Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  software-tests:
    runs-on: self-hosted

    strategy:
      matrix:
        module: [VSM, HVC]
        include:
          - module: VSM
            build_dir: build/vsm-state-tests
          - module: HVC
            build_dir: build/hvc-state-tests

    steps:
      - name: Checkout Project
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Show Test Environment
        run: |
          cmake --version
          ctest --version
          cc --version

      - name: Configure ${{ matrix.module }} Tests
        run: cmake -S ${{ matrix.module }}/tests -B ${{ matrix.build_dir }}

      - name: Build ${{ matrix.module }} Tests
        run: cmake --build ${{ matrix.build_dir }}

      - name: Run ${{ matrix.module }} Tests
        run: ctest --test-dir ${{ matrix.build_dir }} --output-on-failure
